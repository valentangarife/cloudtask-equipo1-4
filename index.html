<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudTasks</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-shell">

    <!-- ===== Menú lateral ===== -->
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <span class="app-brand-mark"><i class="bi bi-check2-square"></i></span>
        <span class="app-title">CloudTasks</span>
      </div>

      <div class="sidebar-user">
        <i class="bi bi-person-circle"></i>
        <span class="small fw-medium" id="user-name">—</span>
      </div>

      <nav class="sidebar-nav">
        <button type="button" class="sidebar-nav-item active" id="nav-tasks" data-view="tasks">
          <i class="bi bi-list-check"></i> Tareas
          <span class="badge task-count-badge ms-auto" id="task-count">0</span>
        </button>
      </nav>

      <!-- ===== Mini calendario ===== -->
      <div class="sidebar-calendar">
        <div class="calendar-header">
          <button type="button" class="calendar-nav-btn" id="cal-prev" aria-label="Mes anterior">
            <i class="bi bi-chevron-left"></i>
          </button>
          <span class="calendar-month-label" id="cal-month-label">Mes</span>
          <button type="button" class="calendar-nav-btn" id="cal-next" aria-label="Mes siguiente">
            <i class="bi bi-chevron-right"></i>
          </button>
        </div>
        <div class="calendar-weekdays">
          <span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span>
        </div>
        <div class="calendar-grid" id="cal-grid"></div>

        <button type="button" class="calendar-clear-btn d-none" id="cal-clear">
          <i class="bi bi-x-circle"></i> Quitar filtro de día
        </button>
      </div>

      <button class="sidebar-logout" id="logout-btn">
        <i class="bi bi-box-arrow-right"></i> Salir
      </button>
    </aside>

    <!-- ===== Contenido principal ===== -->
    <div class="app-main">

      <header class="app-topbar d-lg-none">
        <div class="d-flex align-items-center gap-2">
          <span class="app-brand-mark"><i class="bi bi-check2-square"></i></span>
          <h1 class="h5 mb-0 app-title">CloudTasks</h1>
        </div>
      </header>

      <main class="app-content">
        <div id="status-alert" class="alert d-none" role="alert"></div>
        <div id="day-filter-banner" class="day-filter-banner d-none">
          Mostrando tareas de <strong id="day-filter-label"></strong>
          <button type="button" class="day-filter-clear" id="day-filter-clear-inline">Quitar</button>
        </div>

        <div class="row g-4">

          <!-- ===== Formulario para crear tarea ===== -->
          <div class="col-12 col-lg-4">
            <div class="card task-form-card shadow-sm">
              <div class="card-body">
                <h2 class="form-heading mb-3">Nueva tarea</h2>

                <form id="task-form" novalidate>
                  <div class="mb-3">
                    <label for="title" class="form-label">Título <span class="text-danger">*</span></label>
                    <input
                      type="text"
                      class="form-control"
                      id="title"
                      name="title"
                      placeholder="Ej. Preparar informe técnico"
                      maxlength="80"
                      required
                    >
                    <div class="invalid-feedback">El título es obligatorio (máx. 80 caracteres).</div>
                  </div>

                  <div class="mb-3">
                    <label for="description" class="form-label">Descripción</label>
                    <textarea
                      class="form-control"
                      id="description"
                      name="description"
                      rows="3"
                      maxlength="300"
                      placeholder="Detalles de la tarea (opcional)"
                    ></textarea>
                  </div>

                  <div class="mb-3">
                    <label for="deadline" class="form-label">Fecha límite</label>
                    <input type="date" class="form-control" id="deadline" name="deadline">
                    <div class="invalid-feedback">La fecha límite no puede ser anterior a hoy.</div>
                  </div>

                  <div class="mb-3">
                    <label for="priority" class="form-label">Prioridad</label>
                    <select class="form-select" id="priority" name="priority">
                      <option value="low">Baja</option>
                      <option value="medium" selected>Media</option>
                      <option value="high">Alta</option>
                    </select>
                  </div>

                  <button type="submit" class="btn btn-auth-primary w-100">
                    <i class="bi bi-plus-lg"></i> Agregar tarea
                  </button>
                </form>
              </div>
            </div>
          </div>

          <!-- ===== Lista de tareas ===== -->
          <div class="col-12 col-lg-8">

            <!-- Filtros -->
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
              <div class="btn-group" role="group" aria-label="Filtro de tareas">
                <input type="radio" class="btn-check" name="filter" id="filter-all" value="all" checked>
                <label class="btn btn-outline-secondary btn-sm" for="filter-all">Todas</label>

                <input type="radio" class="btn-check" name="filter" id="filter-pending" value="pending">
                <label class="btn btn-outline-secondary btn-sm" for="filter-pending">Pendientes</label>

                <input type="radio" class="btn-check" name="filter" id="filter-completed" value="completed">
                <label class="btn btn-outline-secondary btn-sm" for="filter-completed">Completadas</label>
              </div>

              <select id="sort-select" class="form-select form-select-sm w-auto">
                <option value="created_desc">Más recientes primero</option>
                <option value="deadline_asc">Fecha límite próxima</option>
                <option value="priority_desc">Prioridad (alta primero)</option>
              </select>
            </div>

            <!-- Estado vacío -->
            <div id="empty-state" class="text-center text-muted py-5 d-none">
              <i class="bi bi-clipboard-check fs-1"></i>
              <p class="mt-2 mb-0">No hay tareas para mostrar.</p>
              <p class="small">Crea tu primera tarea usando el formulario de la izquierda.</p>
            </div>

            <!-- Lista -->
            <ul id="task-list" class="list-unstyled d-flex flex-column gap-2"></ul>

          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Plantilla de una tarea (se clona por JS) -->
  <template id="task-template">
    <li class="card task-card shadow-sm" data-id="">
      <div class="card-body">
        <div class="d-flex align-items-start gap-3">
          <input type="checkbox" class="form-check-input mt-1 task-checkbox" title="Marcar como completada">

          <div class="flex-grow-1">
            <div class="d-flex align-items-center gap-2 flex-wrap">
              <h3 class="h6 mb-0 task-title"></h3>
              <span class="priority-pill"></span>
              <span class="badge status-badge"></span>
            </div>
            <p class="text-muted small mb-1 task-description"></p>
            <div class="d-flex gap-3 small text-muted task-meta">
              <span class="task-created"><i class="bi bi-calendar-plus"></i> <span></span></span>
              <span class="task-deadline"><i class="bi bi-flag"></i> <span></span></span>
            </div>
          </div>

          <button class="btn btn-sm btn-outline-danger task-delete" title="Eliminar tarea">
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </li>
  </template>

  <!-- Bootstrap JS bundle (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Cliente de Supabase (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <!-- Configuración de Supabase (URL y anon key del proyecto) -->
  <script src="js/config.js"></script>

  <!-- Lógica de la aplicación -->
  <script src="js/app.js"></script>
</body>
</html>
